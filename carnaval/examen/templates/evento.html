{% load static %}

<link rel="stylesheet" href="{% static 'css/eventos.css' %}">
 

<div class="eventos-container">
    <div class="evento">
        <img src="{% static 'img/carnaval2.jpg' %}" alt="Imagen del evento">
        <div class="evento-info">
            <h2 class="evento-nombre">{{ evento.name }}</h2>
            <p><strong>Localidad:</strong> {{ evento.localidad.name }}</p>
            <p><strong>Fecha:</strong> {{ evento.fecha_inicio }} - {{ evento.fecha_fin }}</p>
            <a href="{% url 'boletos' evento.id %}" class="btn">Comprar Boleto</a>
        </div>
    </div>
</div>
